[package]
name = "tools666"
version = "0.1.0"
description = "开发者工具箱"
authors = ["shark"]
edition = "2021"

[lib]
name = "tools666_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
